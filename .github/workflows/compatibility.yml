name: compatibility

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        flet-version: ["0.82.0", "latest"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.flet-version }}" = "latest" ]; then
            python -m pip install flet
          else
            python -m pip install "flet==${{ matrix.flet-version }}"
          fi
          python -m pip install ./flet_stt

      - name: Run tests
        run: python -m unittest discover -s tests -v

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.4"

      - name: Resolve Flutter extension dependencies
        working-directory: flet_stt/src/flutter/flet_stt
        run: flutter pub get

      - name: Analyze Flutter extension
        working-directory: flet_stt/src/flutter/flet_stt
        run: flutter analyze
