[project]
name = "flet-stt"
version = "0.1.3"
description = "Speech-to-text for Flet apps via OS-native recognition (Android/iOS)"
requires-python = ">=3.10"
readme = "../README.md"
license = "MIT"
authors = [
    {name = "Alex Stoica", email = "alexstoica@protonmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flet>=0.82.0",
]

[project.urls]
Homepage = "https://github.com/alex-stoica/flet-stt"
Repository = "https://github.com/alex-stoica/flet-stt"
Issues = "https://github.com/alex-stoica/flet-stt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flet_stt", "src/flutter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
